# netlify.toml — Ace STEM Bluebook Simulator
#
# The build does two things, in order:
#   1. gen-config.js  — writes config.js from environment variables, failing
#                       the build if they are missing (see SETUP.md).
#   2. build-site.js  — copies ONLY the files the running app needs into
#                       _site/, which is what gets published.
#
# Required environment variables (Site configuration → Environment variables):
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...  (or SUPABASE_ANON_KEY)
#
# WHY publish is an allowlisted directory rather than the repo root:
# publishing "." exposed every internal file, and redirect rules could not fix
# it. Measured against the live site, Netlify matches redirect `from` paths
# case-SENSITIVELY but serves files case-INSENSITIVELY:
#
#     /tests/injection-proof.js  -> 404   (redirect matched)
#     /TESTS/injection-proof.js  -> 200   (file served anyway)
#
# so every blocklist rule is bypassable by changing capitalisation. Building an
# allowlisted publish directory is deny-by-default: internal files are not
# deployed at all, so no capitalisation of any URL can reach them. It also
# covers files added in future without anyone remembering to write a rule.
#
# _headers (X-Robots-Tag: noindex) is copied into _site by build-site.js —
# it only takes effect inside the publish directory.
#
# For a deliberate local-mode deploy, drop gen-config.js from the command;
# build-site.js will then fail on the missing config.js, which is intentional.

[build]
  # archive-testdata.js --verify writes nothing; it fails the deploy when a
  # version bump was committed without its archive step, or (on a full-
  # history checkout) when the archive index is stale or an archive's bytes
  # stopped matching its source commit. On a SHALLOW checkout it skips the
  # history-dependent checks rather than failing on commits it cannot see —
  # it never reds a healthy deploy — and still catches a forgotten bump
  # whose replaced build is inside the visible history. See the script's
  # header for the full contract.
  command = "node archive-testdata.js --verify && node gen-config.js && node build-site.js"
  publish = "_site"
