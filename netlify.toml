# netlify.toml — Ace STEM Bluebook Simulator
#
# The site is served straight from the repo root: index.html plus the split
# js/css files, exactly as they sit here. There is no bundler. The only build
# step generates config.js (gitignored, so absent from the checkout) from
# environment variables — and fails the build if they are missing, so a
# misconfigured environment can never quietly deploy a local-mode site.
#
# Required environment variables (Site configuration → Environment variables):
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...  (or SUPABASE_ANON_KEY)
#
# For a deliberate local-mode deploy, delete this [build] section.

[build]
  command = "node gen-config.js"
  publish = "."

# _headers (X-Robots-Tag: noindex) sits in the repo root, which publish = "."
# makes the publish directory — keep those two in step if either ever moves.

# The publish root is the whole repo, so these paths would otherwise be
# fetchable on the live domain. reference/ in particular holds real College
# Board PDFs and screenshots that should not be served from davidsatprep.com.
[[redirects]]
  from = "/reference/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
